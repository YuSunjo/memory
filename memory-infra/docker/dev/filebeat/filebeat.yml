filebeat.inputs:
  # Memory Application Logs
  - type: log
    enabled: true
    paths:
      - /var/log/memory/application*.log
    fields:
      service: memory-api
      environment: dev
      log_type: application
    fields_under_root: true
    multiline.pattern: '^\\{'
    multiline.negate: true
    multiline.match: after
    exclude_lines: ['^$']
    ignore_older: 0
    close_inactive: 5m
    scan_frequency: 10s

  # Memory API Logs
  - type: log
    enabled: true
    paths:
      - /var/log/memory/api*.log
    fields:
      service: memory-api
      environment: dev
      log_type: api
    fields_under_root: true
    multiline.pattern: '^\\{'
    multiline.negate: true
    multiline.match: after
    exclude_lines: ['^$']
    ignore_older: 0
    close_inactive: 5m
    scan_frequency: 5s

  # Memory Error Logs
  - type: log
    enabled: true
    paths:
      - /var/log/memory/error*.log
    fields:
      service: memory-api
      environment: dev
      log_type: error
    fields_under_root: true
    multiline.pattern: '^\\{'
    multiline.negate: true
    multiline.match: after
    exclude_lines: ['^$']
    ignore_older: 0
    close_inactive: 5m
    scan_frequency: 5s

  # Memory Business Logs
  - type: log
    enabled: true
    paths:
      - /var/log/memory/business*.log
    fields:
      service: memory-api
      environment: dev
      log_type: business
    fields_under_root: true
    multiline.pattern: '^\\{'
    multiline.negate: true
    multiline.match: after
    exclude_lines: ['^$']
    ignore_older: 0
    close_inactive: 5m
    scan_frequency: 10s

  # Docker Container Logs (비활성화)
  - type: container
    enabled: false
    paths:
      - /var/lib/docker/containers/*/*.log
    containers.ids:
      - "*"
    exclude_containers:
      - "memory-postgres-dev"
      - "memory-minio-dev"
      - "memory-elasticsearch-dev"
      - "memory-kibana-dev"
      - "memory-prometheus-dev"
      - "memory-grafana-dev"
      - "memory-logstash-dev"
      - "memory-filebeat-dev"
    fields:
      environment: dev
      log_type: container
    fields_under_root: true

# Logstash Output 설정
output.logstash:
  hosts: ["logstash:5044"]
  compression_level: 3
  worker: 2
  bulk_max_size: 2048
  timeout: 30s
  pipelining: 2

# Filebeat 자체 로그 설정
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0600

# 성능 설정
filebeat.registry.path: /usr/share/filebeat/data/registry
filebeat.registry.file_permissions: 0600
filebeat.registry.flush: 1s

# 모니터링 설정
monitoring.enabled: true
monitoring.elasticsearch:
  hosts: ["elasticsearch:9200"]
  username: elastic
  password: ${ELASTICSEARCH_PASSWORD}

# 프로세서 설정
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_docker_metadata: ~
  - add_kubernetes_metadata: ~
  - timestamp:
      field: json.timestamp
      layouts:
        - '2006-01-02 15:04:05.000'
        - '2006-01-02T15:04:05.000Z'
      test:
        - '2023-12-01 12:34:56.789'