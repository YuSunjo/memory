input {
  beats {
    port => 5044
  }
}

filter {
  # FileBeat에서 오는 메타데이터 처리
  if [agent][type] == "filebeat" {
    mutate {
      add_field => { "log_source" => "filebeat" }
    }
  }

  # JSON 로그 파싱
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed_json"
    }

    # 파싱된 JSON 데이터를 최상위로 이동
    if [parsed_json] {
      ruby {
        code => "
          parsed = event.get('parsed_json')
          if parsed.is_a?(Hash)
            parsed.each { |k, v| event.set(k, v) }
            event.remove('parsed_json')
          end
        "
      }
    }
  }

  # 로그 타입별 처리
  if [log][file][path] =~ /application\.log/ {
    mutate {
      add_field => { "log_type" => "application" }
    }
  } else if [log][file][path] =~ /api\.log/ {
    mutate {
      add_field => { "log_type" => "api" }
    }
  } else if [log][file][path] =~ /error\.log/ {
    mutate {
      add_field => { "log_type" => "error" }
    }
  } else if [log][file][path] =~ /business\.log/ {
    mutate {
      add_field => { "log_type" => "business" }
    }
  }

  # API 로그 특별 처리
  if [type] == "API_REQUEST" or [type] == "API_RESPONSE" {
    mutate {
      add_field => { "log_category" => "api_access" }
    }

    # 응답 시간 기반 성능 태그
    if [processingTime] {
      if [processingTime] > 5000 {
        mutate { add_tag => ["slow_api"] }
      } else if [processingTime] > 1000 {
        mutate { add_tag => ["medium_api"] }
      } else {
        mutate { add_tag => ["fast_api"] }
      }
    }

    # HTTP 상태 코드 기반 태그
    if [statusCode] {
      if [statusCode] >= 500 {
        mutate { add_tag => ["server_error"] }
      } else if [statusCode] >= 400 {
        mutate { add_tag => ["client_error"] }
      } else if [statusCode] >= 200 {
        mutate { add_tag => ["success"] }
      }
    }
  }

  # 에러 로그 특별 처리
  if [level] == "ERROR" {
    mutate {
      add_field => { "log_category" => "error" }
      add_tag => ["error"]
    }
  }

  # 타임스탬프 처리
  if [timestamp] {
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS", "ISO8601" ]
      target => "@timestamp"
    }
  }

  # 불필요한 필드 제거
  mutate {
    remove_field => [ "ecs", "host", "agent", "input", "log" ]
  }
}

output {
  # 로그 타입별로 다른 인덱스에 저장
  if [log_type] == "api" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "memory-api-logs-%{+YYYY.MM.dd}"
    }
  } else if [log_type] == "error" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "memory-error-logs-%{+YYYY.MM.dd}"
    }
  } else if [log_type] == "business" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "memory-business-logs-%{+YYYY.MM.dd}"
    }
  } else if [log_type] == "container" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "memory-container-logs-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "memory-application-logs-%{+YYYY.MM.dd}"
    }
  }

  # 개발환경에서는 콘솔 출력도 활성화
  stdout { codec => rubydebug }
}