input {
  beats {
    port => 5044
  }
}

filter {
  # FileBeat에서 오는 메타데이터 처리
  if [agent][type] == "filebeat" {
    mutate {
      add_field => { "log_source" => "filebeat" }
    }
  }

  # JSON 로그 파싱
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed_json"
    }

    # 파싱된 JSON 데이터를 최상위로 이동
    if [parsed_json] {
      ruby {
        code => "
          parsed = event.get('parsed_json')
          if parsed.is_a?(Hash)
            parsed.each { |k, v| event.set(k, v) }
            event.remove('parsed_json')
          end
        "
      }
    }
  }

  # API 로그 특별 처리 (운영 환경 최적화)
  if [type] == "API_REQUEST" or [type] == "API_RESPONSE" {
    mutate {
      add_field => { "log_category" => "api_access" }
    }

    # 응답 시간 기반 성능 태그 (운영 환경 기준)
    if [processingTime] {
      if [processingTime] > 15000 {
        mutate { add_tag => ["critical_slow_api"] }
      } else if [processingTime] > 10000 {
        mutate { add_tag => ["very_slow_api"] }
      } else if [processingTime] > 5000 {
        mutate { add_tag => ["slow_api"] }
      } else if [processingTime] > 2000 {
        mutate { add_tag => ["medium_api"] }
      } else {
        mutate { add_tag => ["fast_api"] }
      }
    }

    # HTTP 상태 코드 기반 태그
    if [statusCode] {
      if [statusCode] >= 500 {
        mutate { add_tag => ["server_error", "alert"] }
      } else if [statusCode] >= 400 {
        mutate { add_tag => ["client_error"] }
      } else if [statusCode] >= 200 {
        mutate { add_tag => ["success"] }
      }
    }

    # 특정 엔드포인트 성능 모니터링
    if [uri] {
      if [uri] =~ /.*\/login.*/ {
        mutate { add_tag => ["auth_endpoint"] }
      } else if [uri] =~ /.*\/api\/.*/ {
        mutate { add_tag => ["api_endpoint"] }
      }
    }
  }

  # 에러 로그 특별 처리 (운영 환경)
  if [level] == "ERROR" or [level] == "FATAL" {
    mutate {
      add_field => { "log_category" => "error" }
      add_tag => ["error", "alert"]
    }
  }

  # 경고 로그 태그
  if [level] == "WARN" {
    mutate {
      add_tag => ["warning"]
    }
  }

  # 타임스탬프 처리
  if [timestamp] {
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS", "ISO8601" ]
      target => "@timestamp"
    }
  }

  # 운영 환경에서 불필요한 필드 제거 (성능 최적화)
  mutate {
    remove_field => [ "ecs", "host", "agent", "input", "log", "tags", "beat" ]
  }
}

output {
  # 로그 타입별로 다른 인덱스에 저장 (prod 환경 prefix)
  if [log_type] == "api" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "memory-prod-api-logs-%{+YYYY.MM.dd}"
    }
  } else if [log_type] == "error" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "memory-prod-error-logs-%{+YYYY.MM.dd}"
    }
  } else if [log_type] == "business" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "memory-prod-business-logs-%{+YYYY.MM.dd}"
    }
  } else if [log_type] == "container" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "memory-prod-container-logs-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "memory-prod-application-logs-%{+YYYY.MM.dd}"
    }
  }

  # 운영 환경에서는 콘솔 출력 완전히 비활성화
  # stdout { codec => rubydebug }
}